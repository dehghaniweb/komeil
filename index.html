<!doctype html>
<html lang="fa" dir="rtl" data-theme="green" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>دعای کمیل</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <h1>دعای کمیل</h1>
  <button class="ibtn" id="btn-mode" title="شب / روز" aria-label="شب و روز">☾</button>
  <button class="ibtn" id="btn-set" title="تنظیمات" aria-label="تنظیمات">⚙</button>
</header>

<main id="view-main">
  <section class="intro" id="intro">
    <button id="intro-toggle"><span>مقدمهٔ دعا</span><span id="intro-arrow">▾</span></button>
    <div class="body" id="intro-body" hidden></div>
  </section>
  <div id="lines"></div>
  <div class="source" id="source-line" hidden></div>
</main>

<main id="view-fix" hidden></main>

<div id="arrows">
  <button id="a-top" aria-label="اول دعا" title="رفتن به اول دعا"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="a-cur" aria-label="جملهٔ در حال پخش" title="رفتن به جملهٔ در حال پخش"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M5.5 12.5L12 19l6.5-6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<div id="player">
  <div class="row">
    <input type="range" id="seek" min="0" max="130" value="0" step="1" aria-label="جمله">
    <span id="info"></span>
  </div>
  <div class="row"><div class="modes" id="modes">
    <button data-m="ar">فقط عربی</button><button data-m="both">عربی و ترجمه</button><button data-m="fa">فقط ترجمه</button>
  </div></div>
  <div class="ctl">
    <button id="c-prev" aria-label="جملهٔ قبل" title="جملهٔ قبل"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(.3 0)"><rect x="5.4" y="5" width="2.6" height="14" rx="1.3"/><path d="M10 12l8.2-5.8v11.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g></svg></button>
    <button id="c-play" class="play" aria-label="پخش"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
    <button id="c-next" aria-label="جملهٔ بعد" title="جملهٔ بعد"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-.3 0)"><rect x="16" y="5" width="2.6" height="14" rx="1.3"/><path d="M14 12L5.8 6.2v11.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g></svg></button>
    <button id="c-rate" class="rate" aria-label="سرعت">۱×</button>
  </div>
</div>

<div id="sheet-bg"></div>
<div id="sheet" role="dialog" aria-label="تنظیمات"></div>

<script src="data.js"></script>
<script src="times.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
